name: TVBox 自动更新

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: tvbox-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 运行更新脚本
        env:
          CF_PROXY: https://tv.cc0cd.cc.cd
        run: python3 update.py

      - name: 推送更新
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.email "bot@tvbox.local"
          git config user.name "TVBox Bot"
          git add -A
          git diff --cached --quiet && echo "无变更" && exit 0
          git commit -m "auto update: $(date -u '+%Y-%m-%d %H:%M:%S')"

          # 推送到你的 GitHub 仓库
          git remote set-url origin https://shifeiquan520:${GH_PAT}@github.com/shifeiquan520/shifeiquan1.git
          git push origin HEAD:master
